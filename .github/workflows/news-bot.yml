name: news-bot

# Each run starts the next one when it finishes, so the bot runs back to back without relying on
# GitHub's cron (which can be delayed or skipped). The cron entry only revives the chain if it breaks.
# To stop the bot: cancel the running workflow, or disable the workflow in the Actions tab.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - bot.py
      - requirements.txt
      - .github/workflows/news-bot.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --minutes 15 --interval 60

      - name: Save state
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json config.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update bot state [skip ci]"
          git pull --rebase -X theirs
          git push

      - name: Start next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run news-bot.yml --ref main
